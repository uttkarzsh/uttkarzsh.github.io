<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="uttkarsh — coder working on systems, kernels, compilers and inference.">
    <meta name="theme-color" content="#0e0e0f">
    <meta name="color-scheme" content="dark">

    <!-- apply the saved theme before first paint; the app takes over once loaded -->
    <script>
        try {
            var t = localStorage.getItem("theme");
            if (t) document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
    </script>

    <title>uttkarzsh - welcome to my roman empire</title>

    <link data-trunk rel="icon" href="assets/favicon.png">
    <!-- trunk can't process apple-touch-icon, so copy it to the root as-is and link it there -->
    <link data-trunk rel="copy-file" href="assets/apple-touch-icon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap"
    >

    <link data-trunk rel="css" href="styles.css">

    <script type="module" src="https://ascii.rest/ascii.js"></script>
</head>

<body>
</body>
</html>
